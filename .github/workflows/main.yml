name: MongoDB & Mongo Express CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: codespace-mongo-cluster
          wait: 90s

      - name: Deploy MongoDB and Mongo Express
        run: |
          kubectl apply -f .

      - name: Wait for pods to be ready
        run: |
          kubectl rollout status deployment/mongodb-deployment --timeout=180s
          kubectl rollout status deployment/mongo-express --timeout=180s
          kubectl get pods

      - name: Verify Mongo Express UI endpoint
        run: |
          kubectl get pods
          kubectl logs deployment/mongo-express --tail=30 || true
          kubectl run curl-test --rm -i --restart=Never --image=curlimages/curl -- \
            --retry 5 --retry-delay 3 --retry-connrefused -I http://mongo-express-service:8081

